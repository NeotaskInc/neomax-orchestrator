name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install shell dependency
        run: sudo apt-get update && sudo apt-get install --yes zsh
      - name: Run hermetic test suites
        run: npm test
      - name: Check Python and shell syntax
        run: |
          python3 -m py_compile lib/neomax_core.py lib/neomax/*.py tests/test_neomax.py tests/neomax_tests/*.py bin/neomax-portal
          zsh -n bin/neomax bin/cmax bin/cdx bin/cdxmax bin/ocx bin/ocmax bin/kmx bin/kmax bin/gmx bin/gmax bin/neomax-usage-agent shell/neomax-aliases.zsh
          bash -n install.sh uninstall.sh project/neomax-worktrees standalone-rotate/install.sh standalone-rotate/uninstall.sh
      - name: Check portal JavaScript
        run: |
          python3 -c 'import pathlib,re,sys; source=pathlib.Path("bin/neomax-portal").read_text(); match=re.search(r"<script>(.*?)</script>", source, re.S); sys.stdout.write(match.group(1) if match else "")' | node --check
      - name: Check committed whitespace
        run: git show --check --format= HEAD
